name: Publish Tekes NewAPI image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tekes-token-admin

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Record deployed version
        run: echo 'v1.0.0-rc.38-tekes.1' > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build linux/amd64 image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: tekesapps/new-api:v1.0.0-rc.38-tekes.1
          outputs: type=docker,dest=/tmp/new-api-v1.0.0-rc.38-tekes.1-linux-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress and checksum image
        run: |
          gzip -9 /tmp/new-api-v1.0.0-rc.38-tekes.1-linux-amd64.tar
          cd /tmp
          sha256sum new-api-v1.0.0-rc.38-tekes.1-linux-amd64.tar.gz > new-api-v1.0.0-rc.38-tekes.1-linux-amd64.sha256

      - name: Publish deployable release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v1.0.0-rc.38-tekes.1
          target_commitish: ${{ github.sha }}
          name: NewAPI v1.0.0-rc.38 Tekes 1
          prerelease: true
          files: |
            /tmp/new-api-v1.0.0-rc.38-tekes.1-linux-amd64.tar.gz
            /tmp/new-api-v1.0.0-rc.38-tekes.1-linux-amd64.sha256
